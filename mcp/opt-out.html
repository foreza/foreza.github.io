<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opt Out / Withdraw Consent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      padding: 40px 28px;
    }
    h1 {
      color: #333;
      font-size: 1.6em;
      margin-bottom: 1.5em;
      letter-spacing: 0.02em;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.5em;
    }
    label {
      font-size: 1.08em;
      color: #444;
      margin-bottom: 0.4em;
    }
    input, textarea {
      font-size: 1em;
      padding: 0.7em;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fafbfc;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
      max-height: 240px;
    }
    button {
      padding: 0.9em;
      font-size: 1.08em;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 1em;
      transition: background 0.2s;
    }
    button:hover {
      background: #357ab8;
    }
    .note {
      margin-top: 2em;
      font-size: 0.98em;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Opt Out / Withdraw Consent</h1>
    <form id="optoutForm">
      <div>
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="e.g. Request to Opt Out" required>
      </div>
      <div>
        <label for="body">Message</label>
        <textarea id="body" name="body" placeholder="Describe your request..." required></textarea>
      </div>
      <button type="submit">Submit Request</button>
    </form>
    <div class="note">
      Your request will be sent to jasonthechiu@gmail.com via your email client.
    </div>
  </div>
  <script>
    document.getElementById('optoutForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const subject = encodeURIComponent(document.getElementById('subject').value);
      const body = encodeURIComponent(document.getElementById('body').value);
      window.location.href = `mailto:jasonthechiu@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
